name: Android CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # A "Release LSPatch v…" commit is cut straight to a v* tag, which builds and publishes it. Skip
    # its redundant master-push build entirely so the same code never builds (or canaries) twice.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'Release LSPatch v')) }}
    permissions:
      contents: write # publish canary prereleases and tagged releases
    env:
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_HARDLINK: 'true'
      CCACHE_BASEDIR: '${{ github.workspace }}'

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Patch Vector
      shell: bash
      run: |
          FILE="core/build.gradle.kts"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: Cannot find $FILE"
            exit 1
          fi
          python3 - "$FILE" <<'PY'
          import re
          import sys
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          pattern = r'(?m)^(\s*val\s+androidMinSdkVersion\s*=\s*)\d+(\s*(?://.*)?)$'
          updated, count = re.subn(pattern, r'\g<1>24\g<2>', content)
          if count != 1:
              raise SystemExit(
                  f"ERROR: Expected exactly one androidMinSdkVersion declaration, found {count}"
              )
          with open(path, "w", encoding="utf-8") as f:
              f.write(updated)
          print("Patched androidMinSdkVersion = 24")          
          PY
          grep -n 'androidMinSdkVersion' "$FILE"
  
    - name: Patch InMemoryDexClassLoader
      run: |
        python3 - <<'PY'
        from pathlib import Path
        for p in Path("core").rglob("*.cpp"):
            s = p.read_text()
            old = 'auto in_memory_cl_class = lsplant::JNI_FindClass(env, "dalvik/system/InMemoryDexClassLoader");'
            new = 'auto in_memory_cl_class = (android_get_device_api_level() >= 26) ? lsplant::JNI_FindClass(env, "dalvik/system/InMemoryDexClassLoader") : lsplant::JNI_FindClass(env, "oldlib/dalvik/system/InMemoryDexClassLoader");'
            old2 = 'static auto in_memory_classloader =\n        lsplant::JNI_NewGlobalRef(env, lsplant::JNI_FindClass(env, "dalvik/system/InMemoryDexClassLoader"));'
            new2 = 'static auto in_memory_classloader =\n        lsplant::JNI_NewGlobalRef(env,\n            (android_get_device_api_level() >= 26)\n                ? lsplant::JNI_FindClass(env, "dalvik/system/InMemoryDexClassLoader")\n                : lsplant::JNI_FindClass(env, "oldlib/dalvik/system/InMemoryDexClassLoader"));'
            changed = False
            if old in s:
                s = s.replace(old, new)
                changed = True
            if old2 in s:
                s = s.replace(old2, new2)
                changed = True
            if changed and '#include <android/api-level.h>' not in s:
                lines = s.splitlines(True)
                out = []
                inserted = False
                for line in lines:
                    out.append(line)
                    if not inserted and line.startswith('#include '):
                        out.append('#include <android/api-level.h>\n')
                        inserted = True
                if not inserted:
                    out = ['#include <android/api-level.h>\n'] + lines
                s = ''.join(out)
            if changed:
                p.write_text(s)
                print("patched:", p)
        PY

    - name: Patch ByteBufferDexClassLoader
      run: |
          python3 - << 'EOF'
          import glob
          for stub_path in glob.glob("**/stubs/**/BaseDexClassLoader.java", recursive=True):
              with open(stub_path, "r", encoding="utf-8") as f:
                  stub_code = f.read()
              if "File optimizedDirectory" not in stub_code:
                  stub_ctor = (
                      "    public BaseDexClassLoader(String dexPath, java.io.File optimizedDirectory, "
                      "String librarySearchPath, ClassLoader parent) {\n"
                      "        throw new RuntimeException(\"Stub!\");\n"
                      "    }\n}"
                  )
                  stub_code = stub_code[:stub_code.rfind("}")] + stub_ctor
                  with open(stub_path, "w", encoding="utf-8") as f:
                      f.write(stub_code)
                  print(f"Updated stub: {stub_path}")
          new_java_code = """package hidden;

          import android.os.Build;
          import java.lang.reflect.Field;
          import java.nio.ByteBuffer;
          import dalvik.system.BaseDexClassLoader;

          public class ByteBufferDexClassLoader extends BaseDexClassLoader {

              public ByteBufferDexClassLoader(ByteBuffer[] dexFiles, ClassLoader parent) {
                  super("", null, null, parent);
                  try {
                      BaseDexClassLoader delegate = (Build.VERSION.SDK_INT >= 26)
                              ? new BaseDexClassLoader(dexFiles, parent)
                              : (BaseDexClassLoader) Class.forName("oldlib.dalvik.system.InMemoryDexClassLoader", true, ByteBufferDexClassLoader.class.getClassLoader()).getConstructor(ByteBuffer[].class, ClassLoader.class)
                               .newInstance(dexFiles, parent);
                      Field pathListField = BaseDexClassLoader.class.getDeclaredField("pathList");
                      pathListField.setAccessible(true);
                      Object pathList = pathListField.get(delegate);
                      Field contextField = pathList.getClass().getDeclaredField("definingContext");
                      contextField.setAccessible(true);
                      contextField.set(pathList, this);
                      pathListField.set(this, pathList);
                  } catch (Throwable e) {
                      throw new RuntimeException("Failed to init ByteBufferDexClassLoader", e);
                  }
              }

              public ByteBufferDexClassLoader(ByteBuffer[] dexFiles, String librarySearchPath, ClassLoader parent) {
                  super(dexFiles, librarySearchPath, parent);
              }
          }
          """
          clean_code = "\n".join(line[10:] if line.startswith("          ") else line for line in new_java_code.splitlines()) + "\n"
          targets = glob.glob("**/ByteBufferDexClassLoader.java", recursive=True)
          assert targets, "Not found file ByteBufferDexClassLoader.java!"
          for target in targets:
              with open(target, "w", encoding="utf-8") as f:
                  f.write(clean_code)
              print(f"Patched successfully: {target}")
          EOF

    - name: Patch Executable
      run: |
          python3 -c "
          import re, os, sys
          changed = 0
          for root, _, files in os.walk('.'):
              if '.git' in root: continue
              for fn in files:
                  if not fn.endswith(('.cpp', '.cc', '.h', '.hpp')): continue
                  p = os.path.join(root, fn)
                  s = open(p, encoding='utf-8', errors='ignore').read()
                  if 'java/lang/reflect/Executable' not in s: continue
                  s = s.replace('java/lang/reflect/Executable', 'java/lang/reflect/Member')
                  s = re.sub(r'\bExecutable\b', 'Member', s)
                  open(p, 'w', encoding='utf-8').write(s)
          for root, _, files in os.walk('.'):
              if '.git' in root or 'core/external' in root: continue
              for fn in files:
                  if not fn.endswith(('.kt', '.java')): continue
                  p = os.path.join(root, fn)
                  s = open(p, encoding='utf-8', errors='ignore').read()
                  o = s
                  s = s.replace('java.lang.reflect.Executable', 'java.lang.reflect.Member')
                  s = re.sub(r'\bExecutable\b', 'Member', s)
                  s = re.sub(r'(\w+)\.parameterTypes', r'(\1 as java.lang.reflect.Method).parameterTypes', s)
                  s = re.sub(r'(\w+)\.isAccessible = true', r'(\1 as java.lang.reflect.AccessibleObject).isAccessible = true', s)
                  lines = s.split('\n')
                  seen, out = set(), []
                  for l in lines:
                      if l.startswith('import ') and l in seen: continue
                      if l.startswith('import '): seen.add(l)
                      out.append(l)
                  s = '\n'.join(out)
                  if s != o:
                      open(p, 'w', encoding='utf-8').write(s)
                      changed += 1
                      print(f'  patched: {p}')
          print(f'done: {changed} files')
          "
           
    - name: Write key
      if: github.event_name != 'pull_request'
      run: |
        if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
        fi

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup ninja
      uses: seanmiddleditch/gha-setup-ninja@v6
      with:
        version: 1.12.0

    - name: Remove Android's cmake
      shell: bash
      run: rm -rf $ANDROID_HOME/cmake

    - name: Set short commit id
      run: echo "commit=$(echo ${{ github.sha }} | cut -c-7)" > $GITHUB_ENV

    - name: Build with Gradle
      run: |
        {
          echo 'org.gradle.parallel=true'
          echo 'org.gradle.jvmargs=-Xmx2048m'
          echo 'android.native.buildOutput=verbose'
        } >> gradle.properties
        ./gradlew buildAll

    - name: Upload Debug artifact
      uses: actions/upload-artifact@v7
      with:
        name: lspatch-debug-${{ env.commit }}
        path: out/debug/*

    - name: Upload Release artifact
      uses: actions/upload-artifact@v7
      with:
        name: lspatch-release-${{ env.commit }}
        path: out/release/*

    - name: Upload mappings
      uses: actions/upload-artifact@v7
      with:
        name: mappings-${{ env.commit }}
        path: |
          patch-loader/build/outputs/mapping
          manager/build/outputs/mapping

    - name: Upload symbols
      uses: actions/upload-artifact@v7
      with:
        name: symbols-${{ env.commit }}
        path: |
          patch-loader/build/symbols

    # --- stable release (pushed v* tag) --------------------------------------------------------
    #
    # `git tag vX && git push --tags` publishes the release here from the very apk/jar this build
    # produced — nothing is hand-uploaded, so the assets can never drift from what was built. The
    # release is named by its tag, the notes come from CHANGELOG.md in the repo (overwritten per
    # release), and both the release and debug outputs are attached. Bump verName before tagging.
    - name: Publish release
      if: ${{ success() && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        # `%s` argument, never the format string, so a `%` anywhere in the changelog stays literal.
        # CHANGELOG.md is optional -- an absent one just leaves the notes as the tag header.
        notes=$(printf '# LSPatch %s\n\n%s\n' "${TAG}" "$(cat CHANGELOG.md 2>/dev/null || true)")
        # Collect the built assets by their real names and fail loudly if the apk or jar is missing,
        # rather than letting a glob publish a half-empty release. Both variants are attached.
        shopt -s nullglob
        assets=(out/release/manager-*.apk out/release/lspatch-*.jar out/debug/manager-*.apk out/debug/lspatch-*.jar)
        ls out/release/manager-*.apk >/dev/null 2>&1 || { echo "::error::no release manager APK built"; exit 1; }
        ls out/release/lspatch-*.jar >/dev/null 2>&1 || { echo "::error::no release lspatch jar built"; exit 1; }
        # Recreated rather than edited so a re-run replaces the assets instead of appending a second
        # copy. No --cleanup-tag: the release is rebuilt, the pushed release tag is kept.
        gh release delete "$TAG" --yes 2>/dev/null || true
        gh release create "$TAG" \
          --latest \
          --title "LSPatch ${TAG}" \
          --notes "$notes" \
          "${assets[@]}"  
